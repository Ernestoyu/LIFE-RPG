
name: Build Android APK

on:
  workflow_dispatch:
  push:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Extract Android project
        run: |
          unzip -o LIFE_RPG_GitHub_Build_Package.zip -d /tmp/liferpg
          cp -a /tmp/liferpg/LIFE_RPG_GitHub_Build_Package/. .

      - name: Extract LIFE RPG game
        run: |
          mkdir -p app/src/main/assets/game
          unzip -o LIFE_RPG_v1_1.zip -d app/src/main/assets/game
          test -f app/src/main/assets/game/index.html

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Build debug APK
        run: gradle --no-daemon assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: LIFE-RPG-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          
